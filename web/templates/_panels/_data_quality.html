<!-- Data Quality metric panel -->
<div id="panel-data-quality" class="metric-panel hidden">
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm p-5">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Data Quality</h2>
    <form id="form-data-quality" method="post" enctype="multipart/form-data">
      <input type="file" id="file" name="file" style="display: none;" />
      <div id="checkboxContainer_quality" class="checkboxContainer">
        <div class="checkboxContainerIndividual">
          <label class="material-checkbox">
            <input type="checkbox" name="completeness" id="toggleButton_completeness" onchange="toggleValue(this)" />
            <span class="checkmark"></span>
            Check completeness
            <span class="info-icon">i<span class="info-text">This option checks the proportion of NaN values in each feature and displays a bar chart highlighting features with only missing values.</span></span>
          </label>
          <label class="material-checkbox">
            <input type="checkbox" name="outliers" onchange="toggleValue(this)" />
            <span class="checkmark"></span>
            Check outliers
            <span class="info-icon">i<span class="info-text">This option checks for outliers in numerical features using the Inter Quartile Range (IQR) method and displays a bar chart highlighting features with outliers.</span></span>
          </label>
          <label class="material-checkbox">
            <input type="checkbox" name="duplicity" onchange="toggleValue(this)" />
            <span class="checkmark"></span>
            Check duplicity
            <span class="info-icon">i<span class="info-text">This option checks for duplicate rows in the dataset and display the proportion of overall duplicates in the dataset.</span></span>
          </label>
          <label class="material-checkbox">
            <input type="checkbox" name="custom_outliers" id="toggleButton_custom_outliers" onchange="toggleValue(this); toggleCustomOutlierEditor(this)" />
            <span class="checkmark"></span>
            Check outliers with custom criteria
            <span class="info-icon">i<span class="info-text">Define expected valid values for selected columns or HDF5 datasets. Values that do not satisfy these conditions are flagged.</span></span>
          </label>
        </div>
      </div>
      <div id="custom-outlier-editor" class="hidden mt-4 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
        <input type="hidden" name="custom_outlier_rules" id="custom-outlier-rules-json" value="[]" />
        <div class="flex items-center justify-between gap-3 mb-3">
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white">Custom criteria rules</h3>
          <button type="button" id="custom-outlier-add-rule"
                  class="px-3 py-1.5 text-xs font-medium text-blue-700 rounded-lg border border-blue-200 hover:bg-blue-50 dark:text-blue-300 dark:border-blue-800 dark:hover:bg-blue-900/20">
            Add rule
          </button>
        </div>
        <p class="mb-3 text-xs text-gray-600 dark:text-gray-300">Rules define expected valid values. Values that do not satisfy these conditions are flagged.</p>
        <div id="custom-outlier-message" class="hidden mb-3 text-xs text-amber-700 dark:text-amber-300"></div>
        <div id="custom-outlier-rule-list" class="space-y-3"></div>
        <div class="mt-3 grid gap-3 sm:grid-cols-3">
          <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">
            Preview cap per rule
            <input type="number" min="0" step="1" name="max_outliers" placeholder="default: 100"
                   class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-2 py-1 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
          </label>
          <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">
            Export cap per rule
            <input type="number" min="0" step="1" name="max_export_rows" value="10000"
                   class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-2 py-1 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
          </label>
          <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">
            Scan limit per rule
            <input type="number" min="0" step="1" name="scan_limit" placeholder="Full scan"
                   class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-2 py-1 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
          </label>
        </div>
        <label class="mt-3 inline-flex items-center gap-2 text-xs font-medium text-gray-700 dark:text-gray-300">
          <input type="checkbox" name="stop_after_outliers" value="yes"
                 class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700" />
          Stop scanning after preview cap is reached
        </label>
      </div>
      <div class="flex items-center justify-end pt-4 mt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button" onclick="withSubmitGuard(this, () => workspaceSubmit('/data-quality'));"
                class="px-5 py-2.5 text-sm font-medium text-white rounded-lg cursor-pointer bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 transition-colors">
          Submit
        </button>
      </div>
    </form>
  </div>
</div>

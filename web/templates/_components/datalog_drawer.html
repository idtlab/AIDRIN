<!-- Datalog popup (controlled by .open-popup class) -->
<div id="datalog-popup" class="datalog-popup flex-col items-center text-center rounded-2xl shadow-2xl bg-[#1A1A2E] dark:bg-[#F0EEF6] text-[#F0EEF6] dark:text-[#1A1A2E]" style="min-width: 50vh; max-height: 50%; padding: 0 30px; border: 2px solid var(--backgroundColor);">
  <h2 class="font-semibold text-lg mt-4">Datalog</h2>
  <div class="radio-group flex gap-4 text-base my-3 justify-center">
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="radio" name="tableSwitch" value="masterLog" checked class="accent-blue-600" /> Master
    </label>
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="radio" name="tableSwitch" value="fileUploadLog" class="accent-blue-600" /> File Upload
    </label>
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="radio" name="tableSwitch" value="metricLog" class="accent-blue-600" /> Metric Specific
    </label>
  </div>
  <div class="scrollable-container active" id="masterLog">
    <div class="relative overflow-x-auto">
      <table id="masterLogTable" class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
          <tr><th scope="col" class="px-3 py-2">Time</th><th scope="col" class="px-3 py-2">Logger</th><th scope="col" class="px-3 py-2">Message</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="scrollable-container" id="fileUploadLog">
    <div class="relative overflow-x-auto">
      <table id="fileUploadLogTable" class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
          <tr><th scope="col" class="px-3 py-2">Time</th><th scope="col" class="px-3 py-2">Message</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="scrollable-container" id="metricLog">
    <div class="relative overflow-x-auto">
      <table id="metricLogTable" class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
          <tr><th scope="col" class="px-3 py-2">Time</th><th scope="col" class="px-3 py-2">Message</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <button onclick="closeDatalogPopup()" class="mt-4 w-[40%] my-4 py-2 px-4 text-sm font-medium text-white rounded-lg bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 transition-colors">
    Close Log
  </button>
</div>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Homenaje&display=swap" rel="stylesheet" />
    <!-- Apply dark class before render to prevent flash -->
    <script>if (localStorage.getItem("darkmode") === "active") document.documentElement.classList.add("dark");</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        corePlugins: { preflight: false },
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
    <title>AIDRIN</title>
    <style>
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animated { animation: fadeIn 1.2s ease-out; }
      html, body { font-family: 'Homenaje', sans-serif; margin: 0; padding: 0; }
    </style>
  </head>
  <body class="animated min-h-screen overflow-hidden bg-[var(--backgroundColor)]">

    <!-- Subtle gradient background overlay -->
    <div class="absolute inset-0 -z-10 pointer-events-none"
         style="background: radial-gradient(ellipse at 20% 50%, rgba(216,100,112,0.06) 0%, transparent 60%),
                            radial-gradient(ellipse at 80% 30%, rgba(68,133,244,0.06) 0%, transparent 60%),
                            radial-gradient(ellipse at 50% 80%, rgba(155,107,176,0.05) 0%, transparent 50%);">
    </div>

    <!-- Background patterns -->
    <img src="images/pattern1.png" class="absolute bottom-[13vh] right-[-4vw] opacity-30 -z-10 pointer-events-none" alt="" />
    <img src="images/pattern2.jpg" class="absolute bottom-[80vh] right-[-5vw] opacity-15 -z-10 pointer-events-none" alt="" />
    <img src="images/pattern3.png" class="absolute top-0 left-0 opacity-15 -z-10 pointer-events-none" alt="" />
    <img src="images/pattern3.png" class="absolute top-[40vh] left-0 opacity-15 -z-10 pointer-events-none" alt="" />
    <img src="images/pattern3.png" class="absolute top-[80vh] left-0 opacity-15 -z-10 pointer-events-none" alt="" />
    <img src="images/pattern3.png" class="absolute top-0 left-[25vw] opacity-15 -z-10 pointer-events-none" alt="" />

    <div class="flex flex-row items-center min-h-screen px-8 pt-12 gap-8">

      <!-- Logo -->
      <div class="flex justify-center items-center flex-shrink-0 rounded-2xl p-4">
        <img
          src="images/logo.png"
          alt="AIDRIn Logo"
          class="max-w-[480px] max-h-[480px] pl-[7vw] pt-[7vh]"
        />
      </div>

      <!-- Content -->
      <div class="flex flex-col justify-center max-w-2xl">
        <h1 class="text-[5rem] leading-none font-normal mb-4"
            style="font-family: 'Homenaje', sans-serif; background: linear-gradient(135deg, #D86470, #9B6BB0, #4485F4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
          AIDRIN
        </h1>

        <div class="backdrop-blur-md rounded-2xl p-6 mb-8 shadow-md border"
             style="background: var(--secondaryColor); border-color: rgba(155,107,176,0.15);">
          <p class="text-2xl font-normal leading-relaxed m-0" style="color: var(--textColor);">
            A framework that covers a broad range of readiness dimensions that
            aids in quantitatively and qualitatively evaluating the readiness of data.
          </p>
        </div>

        <div class="flex flex-row flex-wrap gap-6 mt-2">
          <a href="{{ url_for('core.workspace') }}" class="no-underline">
            <button class="relative overflow-hidden rounded-2xl px-12 py-8 text-2xl font-normal cursor-pointer border-none shadow-md hover:shadow-xl hover:text-white dark:hover:text-white transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#9B6BB0] group"
                    style="font-family: 'Homenaje', sans-serif; background: var(--secondaryColor); color: var(--textColor); border: 1px solid rgba(155,107,176,0.2);">
              <span class="relative z-10">Assess Data Readiness</span>
              <span class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-gradient-to-br from-[#D86470] via-[#9B6BB0] to-[#4485F4]"></span>
            </button>
          </a>
        </div>
      </div>
    </div>

    <!-- Version badge -->
    <div class="fixed bottom-2 right-3 text-xs opacity-60" style="color: var(--textColorSecondary);">
      v{{ app_version }} |
      <a href="https://aidrin.readthedocs.io/en/latest/" target="_blank" style="color: var(--linkColor); text-decoration: none;">Docs</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.js"></script>
  </body>
</html>

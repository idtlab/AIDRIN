<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>if (localStorage.getItem("darkmode") === "active") document.documentElement.classList.add("dark");</script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/metric.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        corePlugins: { preflight: false },
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.css" rel="stylesheet" />

    <title>FAIR Compliance Evaluation</title>
  </head>
  <body>
    {% include 'universalComponents.html' %}

    <h1 class="text-center mt-16 mb-6">FAIR Compliance Evaluation</h1>

    <form
      id="uploadForm"
      class="rounded-xl shadow-md p-8 mx-auto mt-0"
      style="max-width: 420px; background: var(--secondaryColor); align-self: center;"
      method="post"
      enctype="multipart/form-data"
    >
      <!-- File upload dropzone -->
      <label
        id="fileUploadContainer"
        for="file"
        class="custum-file-upload"
        style="border-radius: 10px;"
      >
        <div class="icon flex justify-center items-center">
          <svg
            id="uploadIcon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            fill="currentColor" style="color: var(--textColor);"
          >
            <path
              d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"
            />
          </svg>
          <svg
            id="uploadedIcon"
            style="display: none;"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            fill="currentColor" style="color: var(--textColor);"
          >
            <path
              d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"
            />
          </svg>
        </div>
        <div class="text" style="position: relative; padding-top: 10%;">
          <span id="fileLabel">Upload Metadata File (JSON)</span>
        </div>
        <input id="file" type="file" name="metadata" accept=".json" required />
      </label>

      <!-- Clear button (hidden until file chosen) -->
      <button
        type="button"
        id="clearButton"
        class="clear-button"
        style="margin: 0px; margin-bottom: 5px; display: none;"
        onclick="clearFile()"
      >
        Clear Uploaded File
      </button>

      <!-- Metadata type selector -->
      <label for="metadata type" class="block text-sm font-medium mb-1 mt-4" style="color: var(--textColor);">
        Select the metadata type:
      </label>
      <select
        name="metadata type"
        id="metadata type"
        required
        style="margin: 0px; margin-bottom: 16px;"
      >
        <option value="DCAT">DCAT</option>
        <option value="Datacite">Datacite</option>
      </select>

      <div id="formbuttonsContainer" class="flex items-center justify-center gap-3">
        <button class="animated-button" type="button" onclick="submitForm()">
          <span>Submit</span>
          <span></span>
        </button>
        <button
          class="animated-button return"
          type="button"
          onclick="location.href='{{ url_for('core.upload_file') }}'"
        >
          <span>Return</span>
          <span></span>
        </button>
      </div>
    </form>

    <div id="resultContainer" class="max-w-4xl mx-auto mt-6 px-4"></div>

    <script>
      function getLightColor(key) {
        switch (key) {
          case "Findable": return "#ADD8E6";
          case "Accessible": return "#98FB98";
          case "Interoperable": return "#FFD700";
          case "Reusable": return "#FFA07A";
          case "FAIR Compliance Checks": return "#DDA0DD";
          case "Original Metadata": return "#87CEFA";
          case "Other": return "#FFC0CB";
        }
      }

      function submitForm() {
        var form = document.getElementById("uploadForm");
        var formData = new FormData(form);
        document.getElementById("resultContainer").innerHTML = "";
        fetch("/fair-assessment", { method: "POST", body: formData })
          .then(response => response.json())
          .then(data => {
            var resultContainer = document.getElementById("resultContainer");
            if (data && data["Pie chart"]) {
              var imageContainer = document.createElement("div");
              imageContainer.style.display = "flex";
              imageContainer.style.justifyContent = "center";
              imageContainer.style.margin = "20px 0";
              imageContainer.innerHTML = '<img src="data:image/png;base64,' + data["Pie chart"] + '" alt="Pie Chart" style="max-width:100%; height:auto;">';
              resultContainer.appendChild(imageContainer);
            }
            resultContainer.innerHTML += displayKeyValuePairs(data);
          })
          .catch(error => console.error("Error:", error));
      }

      const fileInput = document.getElementById("file");
      const clearBtn = document.getElementById("clearButton");
      const uploadIcon = document.getElementById("uploadIcon");
      const uploadedIcon = document.getElementById("uploadedIcon");
      const container = document.getElementById("fileUploadContainer");
      const fileLabel = document.getElementById("fileLabel");

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          container.style.borderRadius = "10px 10px 0 0";
          container.style.border = "2px solid #e8e8e8";
          container.style.borderBottom = "none";
          container.style.marginBottom = "0px";
          uploadIcon.style.display = "none";
          uploadedIcon.style.display = "block";
          clearBtn.style.display = "inline-block";
          fileLabel.textContent = "File Uploaded: " + fileInput.files[0].name;
        } else {
          resetUI();
        }
      });

      function clearFile() {
        fileInput.value = "";
        container.style.border = "";
        container.style.borderRadius = "10px";
        uploadIcon.style.display = "block";
        uploadedIcon.style.display = "none";
        clearBtn.style.display = "none";
        fileLabel.textContent = "Upload Metadata File (JSON)";
        document.getElementById("resultContainer").innerHTML = "";
      }

      function toggleCollapse(button, key) {
        var nestedList = button.nextElementSibling;
        if (nestedList.style.display === "none") {
          nestedList.style.display = "block";
          button.innerHTML = key;
        } else {
          nestedList.style.display = "none";
          button.innerHTML = key;
        }
      }

      function displayKeyValuePairs(obj) {
        var fairKeys = ["Findable", "Accessible", "Interoperable", "Reusable"];
        var resultHTML = "";
        var tableHTML = '<table border="1" style="border-collapse: collapse; width: 100%; text-align: left;">';
        tableHTML += "<tr>";
        fairKeys.forEach(function (key) {
          tableHTML += `<th style="background-color:${getLightColor(key)}; padding:8px;">${key}</th>`;
        });
        tableHTML += "</tr><tr>";
        fairKeys.forEach(function (key) {
          let cellContent = "—";
          if (obj.hasOwnProperty(key) && typeof obj[key] !== "object") {
            cellContent = obj[key];
          } else if (obj.hasOwnProperty(key) && typeof obj[key] === "object") {
            cellContent = formatObjectToHTML(obj[key]);
          }
          tableHTML += `<td style="padding:8px; vertical-align:middle; line-height:1.4em;">${cellContent}</td>`;
        });
        tableHTML += "</tr></table>";
        resultHTML += tableHTML;

        if (obj.hasOwnProperty("Other")) {
          resultHTML += `<button onclick="toggleCollapse(this,'Other')" style="width: 100%; background-color: ${getLightColor("Other")}; color: black; padding: 14px 20px; margin: 8px 0; border: none; cursor: pointer; border-radius: 4px; font-size: 30px;">Other</button>`;
          resultHTML += `<ul class="nested" style="display: none;">${displayKeyValuePairsNested(obj["Other"])}</ul>`;
        }
        if (obj.hasOwnProperty("Original Metadata")) {
          resultHTML += `<button onclick="toggleCollapse(this,'Original Metadata')" style="width: 100%; background-color: ${getLightColor("Original Metadata")}; color: black; padding: 14px 20px; margin: 8px 0; border: none; cursor: pointer; border-radius: 4px; font-size: 30px;">Original Metadata</button>`;
          resultHTML += `<ul class="nested" style="display: none;">${displayKeyValuePairsNested(obj["Original Metadata"])}</ul>`;
        }
        return resultHTML;
      }

      function formatObjectToHTML(obj) {
        let html = '<ul style="list-style:none; margin:0; padding-left:0;">';
        for (let key in obj) {
          if (typeof obj[key] === "object") {
            html += `<li style="margin:0; padding:2px 0; line-height:1.4em;"><strong>${key}:</strong> ${formatObjectToHTML(obj[key])}</li>`;
          } else {
            html += `<li style="margin:0; padding:2px 0; line-height:1.4em;"><strong>${key}:</strong> <span>${obj[key]}</span></li>`;
          }
        }
        html += "</ul>";
        return html;
      }

      function displayKeyValuePairsNested(obj) {
        let html = "";
        for (let key in obj) {
          if (typeof obj[key] === "object") {
            html += `<li><strong>${key}</strong><ul>${displayKeyValuePairsNested(obj[key])}</ul></li>`;
          } else {
            html += `<li><strong>${key}</strong>: ${obj[key]}</li>`;
          }
        }
        return html;
      }

      function resetPage() { location.reload(); }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.js"></script>
  </body>
</html>

name: Publish to PyPI

# Manual release: Actions > Publish to PyPI > Run workflow, and pick the release tag (e.g. v2026.09.1)
# as the ref. Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Check the ref is a tag matching the package version
        run: |
          version=$(python -c "exec(open('aidrin/_version.py').read()); print(__version__)")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::Run this from tag v$version (got $GITHUB_REF)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install -p /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          printf 'age,income\n25,<=50K\n40,>50K\n,<=50K\n33,>50K\n' > smoke.csv
          /tmp/smoke/bin/python -c "import aidrin; print('aidrin', aidrin.__version__)"
          /tmp/smoke/bin/aidrin list
          /tmp/smoke/bin/aidrin data-quality smoke.csv
          /tmp/smoke/bin/aidrin run class-imbalance smoke.csv income

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aidrin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

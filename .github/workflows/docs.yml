name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install -r docs/requirements.txt

      - name: Build Documentation
        run: make html SPHINXOPTS="-W --keep-going"
        working-directory: ./docs

      # Non-blocking: linkcheck reaches out to third-party sites, so an outage
      # or rate limit elsewhere should not fail an unrelated pull request.
      - name: Check Links
        run: make linkcheck
        working-directory: ./docs
        continue-on-error: true

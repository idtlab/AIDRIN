name: uv

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock-check:
    name: lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  sync:
    name: uv sync
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install from the locked versions
        run: uv sync --locked --python ${{ matrix.python-version }}

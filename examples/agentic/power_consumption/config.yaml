# Agentic evaluation config — UCI Individual Household Electric Power Consumption
#
# Dataset: https://archive.ics.uci.edu/dataset/235/individual+household+electric+power+consumption
#
# Before running:
#   1. Download the dataset and place household_power_consumption.txt in data/
#   2. Download citing papers (2016-2026) and place PDFs in sources/
#   3. Set OPENROUTER_API_KEY (or CBORG_API_KEY if you switch llm.base_url below)
#   4. Run: aidrin agentic build-index -c examples/agentic/power_consumption/config.yaml
#   5. Run: aidrin agentic run -c examples/agentic/power_consumption/config.yaml -o examples/agentic/power_consumption/results.json
#
# All paths below are relative to this config file.
#
# One provider for the whole pipeline — no mixing. Pick OpenRouter or CBORG, not both:
llm:
  base_url: "https://openrouter.ai/api/v1"   # or "https://api.cborg.lbl.gov"
  model: "openai/gpt-oss-120b"                  # chat backend — used by executor, retrieval, complexity_scorer, remediation
  embedding_model: "openai/text-embedding-3-large"   # used by build-index and by retrieval's query embedding

paths:
  data_loader: "./loader.py:load_dataset"
  metadata_csv: "./data/metadata.txt"

profiling:
  full_summary: false

vector_store:
  sources:
    - ./sources
  chunk_size: 1000
  chunk_overlap: 200
  vector_store_name: power_consumption_index

retrieval:
  enabled: true
  max_workers: 4
  top_k: 3
  question:
    - "Which European Union regulation is cited as requiring that the consequences of profiling be informed to the data subject? Return the name of the regulation as a string."
    - "Return True if more than 80% of the data is resampled to align with the widely adopted industry standards for smart meter technology to reduce behavioral noise. Return False if not."


executor:
  enabled: true
  max_attempts: 5
  temperature: 0.0

complexity_scorer:
  enabled: true

remediation:
  enabled: true
  context_chars: 3000

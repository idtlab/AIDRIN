display_name: AIDRIN local file-reference endpoint
engine:
  type: GlobusComputeEngine
  max_workers_per_node: 1
  provider:
    type: LocalProvider
    min_blocks: 0
    max_blocks: 1
    init_blocks: 1
    worker_init: |
      source /opt/aidrin/.venv/bin/activate
      export AIDRIN_FILE_REFERENCE_ALLOWED_ROOTS='["/data/project","/data/shared"]'
      export AIDRIN_FILE_REFERENCE_WEB_SCAN_LIMIT=10000
idle_heartbeats_soft: 10
idle_heartbeats_hard: 5760

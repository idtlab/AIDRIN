# Supervisor config for the AIDRIN all-in-one container.
#
# Runs the three AIDRIN processes (web, worker, beat) side by side. Redis is a
# separate container/workload; point the broker at it via FLASK_CELERY__broker_url.
#
# IMPORTANT (NERSC Spin / Rancher): this container includes Celery *beat*, the
# scheduler. Run this workload with exactly ONE replica. Two replicas would start
# two beat schedulers and double-fire the periodic cleanup task.
#
# All process output goes to the container's stdout/stderr so it shows up in
# `docker logs` / Rancher logs. Runs fine as an arbitrary non-root UID: the
# pidfile and unix socket live under /tmp.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
command=gunicorn --bind 0.0.0.0:5000 --workers %(ENV_GUNICORN_WORKERS)s --timeout %(ENV_GUNICORN_TIMEOUT)s web:create_app()
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_events_enabled=true

[program:worker]
command=celery -A worker.make_celery worker --loglevel=info
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=celery -A worker.make_celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
